<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — LoveIt Anime</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>
  <script>
    // Immediate fail-safe: hide or disable the modal as early as possible.
    (function(){
      function disableModal(){
        try{
          var m = document.getElementById('modal');
          if(m){ m.hidden = true; m.style.display = 'none'; m.style.pointerEvents = 'none'; }
          var vm = document.getElementById('videoModal'); if(vm){ vm.hidden = true; vm.style.display='none'; vm.style.pointerEvents='none'; }
          var mc = document.getElementById('modalClose'); if(mc) mc.style.pointerEvents = 'auto';
        }catch(e){ }
      }
      disableModal();
      if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', disableModal);
      setTimeout(disableModal, 300);
      setTimeout(disableModal, 1200);
    })();
  </script>

  <header class="top">
    <div class="brand">LoveIt <span class="sub">Anime</span></div>
    <div class="search">
      <input id="searchInput" placeholder="Search anime, genres, year..." />
    </div>
    <nav class="nav">
      <button id="btnProfile" class="icon" aria-label="Profile"></button>
      <button id="btnLogout" class="btn-ghost">Logout</button>
    </nav>
  </header>

  <main class="container">
    <section class="welcome card">
      <div>
        <h1 id="greeting">Welcome, Guest</h1>
        <p id="subGreeting">Discover anime, watch trailers and save titles to your watchlist.</p>
      </div>
      <div class="profile-card" id="profileCard"></div>
    </section>

    <!-- New collections added here -->
    <section class="card">
      <h2>New Releases</h2>
      <div id="newReleases" class="grid"></div>
    </section>

    <section class="card">
      <h2>Classics</h2>
      <div id="classics" class="grid"></div>
    </section>

    <section class="card">
      <h2>Top Picks</h2>
      <div id="topPicks" class="grid"></div>
    </section>

    <section class="features">
      <div class="feature-col">
        <div class="card">
          <h2>Trending Now</h2>
          <div id="trending" class="grid"></div>
        </div>
        <div class="card">
          <h2>Recommended for you</h2>
          <div id="recommended" class="grid"></div>
        </div>
      </div>

      <aside class="sidebar">
        <div class="card small-card">
          <h3>Your Watchlist</h3>
          <div id="watchlist"></div>
        </div>
        <div class="card small-card">
          <h3>Favorites</h3>
          <div id="favorites"></div>
        </div>
        <div class="card small-card">
          <h3>Quick Filters</h3>
          <div class="filters">
            <button data-filter="all">All</button>
            <button data-filter="action">Action</button>
            <button data-filter="romance">Romance</button>
            <button data-filter="sci-fi">Sci-Fi</button>
            <button data-filter="slice">Slice of Life</button>
          </div>
        </div>
      </aside>
    </section>

    <section class="card">
      <h2>Browse</h2>
      <div id="browseGrid" class="grid"></div>
    </section>
  </main>

  <!-- details modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-inner card">
      <button id="modalClose" class="modal-close" aria-label="Close details">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- video modal for trailers (YouTube embed) -->
  <div id="videoModal" class="modal" hidden>
    <div class="modal-inner card" style="max-width:calc(100% - 40px); z-index:10002;">
      <button id="videoClose" class="modal-close" aria-label="Close video">×</button>
      <div id="videoHolder" style="width:100%;">
        <!-- updated allow attributes and playsinline handling -->
        <iframe id="playerFrame" src="" frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen style="width:100%;height:360px;border-radius:8px;background:#000;display:block;z-index:10003"></iframe>
      </div>
      <!-- unmute button (hidden by default) - shown if autoplay is muted or user wants sound -->
      <button id="unmuteBtn" class="btn" style="position:absolute;right:20px;bottom:20px;display:none;z-index:10005">Unmute</button>
    </div>
  </div>

  <script src="assets/dashboard.js"></script>
</body>
</html>
