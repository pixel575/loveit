<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Register — LoveIt Anime</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#071028;color:#eef2ff;font-family:Inter,system-ui,Segoe UI,Roboto}
    .box{width:420px;background:#0f1326;padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
    h2{margin:0 0 8px;color:#ff7ab6}
    label{display:block;font-size:13px;color:#b9bee6;margin-top:12px}
    input{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:#0c1020;color:#eef2ff}
    button{width:100%;margin-top:16px;padding:10px;border-radius:8px;border:none;background:#ff7ab6;color:#081026;font-weight:700}
    .small{font-size:13px;color:#9aa0d6;margin-top:10px;text-align:center}
    .error{color:#ffd6e7;font-size:13px;margin-top:8px}
    a{color:#9fc7ff}
  </style>
</head>
<body>
  <div class="box">
    <h2>Create account</h2>
    <form id="regForm" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required minlength="2" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="6" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" required minlength="6" />
      <div id="err" class="error" role="alert" hidden></div>
      <button type="submit">Create account</button>
    </form>
    <div class="small">Already have an account? <a href="login.html">Sign in</a></div>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const err = document.getElementById('err');

    form.addEventListener('submit', e => {
      e.preventDefault();
      err.hidden = true;
      const username = form.username.value.trim();
      const email = form.email.value.trim().toLowerCase();
      const pwd = form.password.value;
      const confirm = form.confirm.value;
      if (!username || !email || !pwd || !confirm) return showError('All fields are required.');
      if (pwd.length < 6) return showError('Password must be at least 6 characters.');
      if (pwd !== confirm) return showError('Passwords do not match.');

      const accounts = JSON.parse(localStorage.getItem('li_accounts') || '[]');
      if (accounts.some(a => a.email === email)) return showError('An account with that email already exists.');

      accounts.push({ username, email, password: pwd, createdAt: new Date().toISOString() });
      localStorage.setItem('li_accounts', JSON.stringify(accounts));
      localStorage.setItem('li_current', JSON.stringify({email, username}));
      alert('Account created (demo only). You are now logged in as ' + username + '.');
      window.location.href = 'index.html';
    });

    function showError(message) {
      err.textContent = message;
      err.hidden = false;
    }
  </script>
</body>
</html>
