<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Register — LoveIt Anime</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/dashboard.css">
  <style>
    .box{max-width:480px}
    .error {
      display: block;
      color: #ff6b9d;
      font-size: 14px;
      margin-top: 10px;
      padding: 10px;
      background: rgba(255, 107, 157, 0.1);
      border-radius: 6px;
      border-left: 3px solid #ff6b9d;
    }
    .success {
      display: block;
      color: #7fff7f;
      font-size: 14px;
      margin-top: 10px;
      padding: 10px;
      background: rgba(127, 255, 127, 0.1);
      border-radius: 6px;
      border-left: 3px solid #7fff7f;
    }
  </style>
</head>
<body>
  <div class="box" style="margin:4vh auto;">
    <h2>Create account</h2>
    <form id="regForm" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required minlength="2" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="6" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" required minlength="6" />
      <div id="err" class="error" role="alert" style="display: none;"></div>
      <div id="success" class="success" role="status" style="display: none;"></div>
      <button type="submit">Create account</button>
    </form>
    <div class="small">Already have an account? <a href="login.html">Sign in</a></div>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const err = document.getElementById('err');
    const success = document.getElementById('success');

    form.addEventListener('submit', e => {
      e.preventDefault();
      err.style.display = 'none';
      success.style.display = 'none';
      err.textContent = '';
      success.textContent = '';
      
      const username = form.username.value.trim();
      const email = form.email.value.trim().toLowerCase();
      const pwd = form.password.value;
      const confirm = form.confirm.value;
      
      if (!username || !email || !pwd || !confirm) {
        return showError('All fields are required.');
      }
      
      if (username.length < 2) {
        return showError('Username must be at least 2 characters.');
      }
      
      if (!email.includes('@')) {
        return showError('Please enter a valid email address.');
      }
      
      if (pwd.length < 6) {
        return showError('Password must be at least 6 characters.');
      }
      
      if (pwd !== confirm) {
        return showError('Passwords do not match.');
      }

      const accounts = JSON.parse(localStorage.getItem('li_accounts') || '[]');
      if (accounts.some(a => a.email === email)) {
        return showError('An account with that email already exists.');
      }

      accounts.push({ username, email, password: pwd, createdAt: new Date().toISOString() });
      localStorage.setItem('li_accounts', JSON.stringify(accounts));
      
      // Show success message and redirect
      showSuccess('Account created successfully! Redirecting to login...');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    });

    function showError(message) {
      err.textContent = message;
      err.style.display = 'block';
      success.style.display = 'none';
    }

    function showSuccess(message) {
      success.textContent = message;
      success.style.display = 'block';
      err.style.display = 'none';
    }
  </script>
</body>
</html>
