<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login — LoveIt Anime</title>
  <link rel="stylesheet" href="assets/dashboard.css">
  <style>
    /* small overrides to reuse dashboard theme */
    .box{max-width:420px}
  </style>
</head>
<body>
  <div class="box" style="margin:6vh auto;">
    <h2>Log in</h2>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="6" />
      <div id="err" class="error" role="alert" hidden></div>
      <button type="submit">Sign in</button>
    </form>
    <div class="small">No account? <a href="register.html">Create one</a></div>
  </div>

  <script>
    // Demo-only client-side auth using localStorage
    const form = document.getElementById('loginForm');
    const err = document.getElementById('err');

    form.addEventListener('submit', e => {
      e.preventDefault();
      err.hidden = true;
      const email = form.email.value.trim().toLowerCase();
      const pwd = form.password.value;
      if (!email || !pwd) return showError('Please fill in both fields.');

      const accounts = JSON.parse(localStorage.getItem('li_accounts') || '[]');
      const acct = accounts.find(a => a.email === email);
      if (!acct) return showError('No account found for that email.');
      if (acct.password !== pwd) return showError('Incorrect password.');

      // store the logged user
      localStorage.setItem('li_current', JSON.stringify({email: acct.email, username: acct.username}));
      // redirect to dashboard
      window.location.href = 'dashboard.html';
    });

    function showError(message) {
      err.textContent = message;
      err.hidden = false;
    }
  </script>
</body>
</html>
